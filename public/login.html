<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efeee9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<title>登录 · Todos</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
<main class="login">
  <div class="login-note" aria-hidden="true"><span>Todos</span></div>
  <form class="login-card" id="form" novalidate>
    <h1>欢迎回来</h1>
    <p>输入访问密码，打开你的便利贴。</p>
    <div class="field">
      <label for="pw">密码</label>
      <input type="password" id="pw" autocomplete="current-password" required autofocus>
    </div>
    <p class="err" id="err" role="alert"></p>
    <button class="btn primary" id="go" type="submit">进入</button>
  </form>
</main>
<script src="js/login.js"></script>
</body>
</html>
